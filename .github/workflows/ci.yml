name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            setup.cfg
            setup.py

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e .
          fi

      - name: Verify Python sources compile
        shell: bash
        run: |
          mapfile -t python_files < <(find . -path ./.git -prune -o -name '*.py' -print)

          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python files found to validate."
            exit 0
          fi

          python -m py_compile "${python_files[@]}"

      - name: Run test suite when present
        shell: bash
        run: |
          if [ -f tox.ini ]; then
            pip install tox
            tox
            exit 0
          fi

          if [ -d tests ] || find . -path ./.git -prune -o -name 'test_*.py' -print -quit | grep -q .; then
            pip install pytest
            pytest
            exit 0
          fi

          echo "No automated tests found."
