name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            setup.cfg
            setup.py

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e .
          fi

      - name: Verify Python sources compile
        shell: bash
        run: |
          mapfile -t python_files < <(
            find . \
              -type f -name '*.py' \
              ! -path './.git/*' \
              ! -path './venv/*' \
              ! -path './.venv/*' \
              ! -path './dist/*' \
              ! -path './build/*' \
              ! -path './__pycache__/*' \
              ! -path './.eggs/*' \
              ! -path '*.egg-info/*'
          )

          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python files found to validate."
            exit 0
          fi

          python -m py_compile "${python_files[@]}"

      - name: Run test suite when present
        shell: bash
        run: |
          if [ -f tox.ini ] || \
            { [ -f setup.cfg ] && grep -Eq '^\[tox([:.][^]]+)?\]$' setup.cfg; } || \
            { [ -f pyproject.toml ] && grep -Eq '^\[tool\.tox(\.[^]]+)?\]$' pyproject.toml; }; then
            pip install "tox>=4"
            tox --skip-missing-interpreters
          elif find . \
            -type f \( -name 'test_*.py' -o -name '*_test.py' -o -name 'conftest.py' \) \
            ! -path './.git/*' \
            ! -path './venv/*' \
            ! -path './.venv/*' \
            ! -path './dist/*' \
            ! -path './build/*' \
            ! -path './__pycache__/*' \
            ! -path './.eggs/*' \
            ! -path '*.egg-info/*' \
            -print -quit | grep -q .; then
            pip install "pytest>=7,<9"
            python -m pytest
          else
            echo "No automated tests found."
          fi
